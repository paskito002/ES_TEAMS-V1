name: Test APIs

on:
  workflow_dispatch:
  push:
    branches:
      - claude/whatsapp-pairing-code-link-srcjgu
    paths:
      - scripts/test-apis.js
      - .github/workflows/test-apis.yml

jobs:
  test-apis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: mkdir -p /tmp/api-test-deps && cd /tmp/api-test-deps && npm init -y && npm install axios form-data
      - run: node scripts/test-apis.js
        env:
          NODE_PATH: /tmp/api-test-deps/node_modules
        timeout-minutes: 15
