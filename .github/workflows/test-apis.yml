name: Test APIs

on:
  workflow_dispatch:
  push:
    branches:
      - claude/whatsapp-pairing-code-link-srcjgu
    paths:
      - scripts/test-apis.js
      - .github/workflows/test-apis.yml

jobs:
  test-apis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev
      - run: node scripts/test-apis.js
